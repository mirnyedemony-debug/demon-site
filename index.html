    <style>
        :root {
            --bg: #100d19;
            --bg-soft: #171222;
            --purple: #a78bfa;
            --pink: #e9a6cf;
            --text: #f5f0ff;
            --muted: #aaa1bb;
            --border: rgba(206, 185, 255, 0.14);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: "Manrope", sans-serif;
            overflow-x: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button, a {
            -webkit-tap-highlight-color: transparent;
        }

        .background-glow {
            position: fixed;
            inset: 0;
            z-index: -2;
            pointer-events: none;
            background:
                radial-gradient(ellipse at 15% 15%,
                    rgba(118, 73, 173, 0.18), transparent 40%),
                radial-gradient(ellipse at 85% 55%,
                    rgba(111, 67, 143, 0.13), transparent 38%),
                radial-gradient(ellipse at 50% 100%,
                    rgba(64, 43, 105, 0.19), transparent 40%);
        }

        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: #e5d6ff;
            box-shadow: 0 0 12px #c5a6ff;
            opacity: 0.5;
            animation: twinkle 4s ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            from { opacity: 0.15; transform: scale(0.8); }
            to { opacity: 0.85; transform: scale(1.2); }
        }

        .container {
            width: min(1120px, 90%);
            margin: 0 auto;
        }

        header {
            padding: 25px 0;
            border-bottom: 1px solid rgba(255,255,255,0.045);
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: rgba(167, 139, 250, 0.1);
            font-size: 23px;
        }

        .nav-link {
            color: var(--muted);
            font-size: 13px;
            transition: color 0.2s;
        }

        .nav-link:hover {
            color: white;
        }

        .nav-button {
            padding: 11px 19px;
            border: 1px solid var(--border);
            border-radius: 30px;
            font-size: 13px;
            transition: 0.25s;
        }

        .nav-button:hover {
            background: rgba(167, 139, 250, 0.12);
            border-color: var(--purple);
        }

            padding: 100px 0 95px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
